[package]
name = "llr_sync"
version = "0.1.0"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
sqlx = { version = "0.8.6", features = ["runtime-tokio", "tls-rustls", "postgres", "uuid", "time"] }
tonic = "0.14.2"
tonic-web = "0.14.2"
serde = { version = "1.0.205", features = ["derive"] }
tracing = "0.1.43"
tracing-subscriber = { version = "0.3.22", features = ["env-filter"] }
bcrypt = "0.17.1"
strum = "0.27.2"
strum_macros = "0.27.2"
jsonwebtoken = { version = "10.2.0", features = ["rust_crypto"] }
moka = { version = "0.12.11", features = ["sync"] }
prost = "0.14.1"
tokio = { version = "1.48.0", features = ["macros", "rt-multi-thread"] }
tokio-stream = "0.1.17"
dotenvy = "0.15.7"
tower-http = { version = "0.6.7", features = ["cors", "trace"] }
tonic-prost = "0.14.2"

[build-dependencies]
protox = "0.9.1"
tonic-build = "0.14.2"
tonic-prost-build = "0.14.2"
